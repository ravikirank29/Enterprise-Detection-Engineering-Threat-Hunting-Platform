<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Detection engineering platform architecture</title>
<desc>Data flows from endpoint and cloud log sources into Splunk, through SPL detections mapped to MITRE ATT&amp;CK, into a notable events index, which feeds dashboards and Python automation used by SOC analysts following incident response playbooks.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="620" fill="#ffffff"/>

<!-- Tier 1: Data sources -->
<g>
<rect x="40" y="30" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="110" y="52" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Sysmon / EDR</text>
<text x="110" y="70" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f5e5a">Endpoint telemetry</text>
</g>
<g>
<rect x="270" y="30" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">AD / Azure AD</text>
<text x="340" y="70" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f5e5a">Auth &amp; identity logs</text>
</g>
<g>
<rect x="500" y="30" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="570" y="52" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Firewall / Proxy</text>
<text x="570" y="70" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5f5e5a">Network &amp; DNS</text>
</g>

<line x1="110" y1="86" x2="300" y2="150" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="86" x2="340" y2="150" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="570" y1="86" x2="380" y2="150" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Tier 2: Splunk indexers -->
<g>
<rect x="190" y="150" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="172" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#04342C">Splunk indexers</text>
<text x="340" y="190" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#085041">Normalized, indexed log data</text>
</g>
<line x1="340" y1="206" x2="340" y2="250" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Tier 3: Detection engine -->
<g>
<rect x="150" y="250" width="380" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="272" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#26215C">23 SPL detections</text>
<text x="340" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#3C3489">Mapped to MITRE ATT&amp;CK</text>
</g>
<line x1="340" y1="306" x2="340" y2="350" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Tier 4: Notable events -->
<g>
<rect x="190" y="350" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="372" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Notable events index</text>
<text x="340" y="390" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#712B13">Enriched, scored alerts</text>
</g>

<line x1="270" y1="406" x2="150" y2="450" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="410" y1="406" x2="530" y2="450" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Tier 5: Dashboards + automation -->
<g>
<rect x="30" y="450" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="150" y="472" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#042C53">Dashboards</text>
<text x="150" y="490" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#0C447C">Executive &amp; SOC triage views</text>
</g>
<g>
<rect x="410" y="450" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="530" y="472" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#042C53">Python automation</text>
<text x="530" y="490" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#0C447C">IOC enrichment, reporting</text>
</g>

<line x1="150" y1="506" x2="340" y2="550" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="530" y1="506" x2="340" y2="550" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Tier 6: Analyst response -->
<g>
<rect x="190" y="550" width="300" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="572" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#173404">SOC analyst response</text>
<text x="340" y="590" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#27500A">Playbook-driven triage</text>
</g>
</svg>
